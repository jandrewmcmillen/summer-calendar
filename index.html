<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisa's Summer 2026 Activity Calendar</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ch:#f97316;--chl:#fff7ed;--fa:#7c3aed;--fal:#f5f3ff;--fr:#16a34a;--rc:#0369a1;--bg:#fafaf9;--su:#fff;--tx:#1c1917;--mu:#78716c;--bd:#e7e5e4}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}
.hdr{background:linear-gradient(135deg,#f97316,#7c3aed);color:#fff;padding:20px 16px 14px;text-align:center}
.hdr h1{font-size:1.4rem;font-weight:700}.hdr p{font-size:.82rem;opacity:.9;margin-top:3px}
.ctrl{background:#fff;border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:20}
.fb{border:1.5px solid var(--bd);background:#fff;border-radius:20px;padding:5px 13px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.fb.aa{background:#1c1917;border-color:#1c1917;color:#fff}
.fb.ac{background:var(--ch);border-color:var(--ch);color:#fff}
.fb.af{background:var(--fa);border-color:var(--fa);color:#fff}
.fb.ar{background:var(--fr);border-color:var(--fr);color:#fff}
.vt{margin-left:auto;display:flex;border:1.5px solid var(--bd);border-radius:8px;overflow:hidden}
.vb{border:none;background:#fff;padding:5px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.vb.on{background:#1c1917;color:#fff}
.sb{border:1.5px solid var(--bd);border-radius:20px;padding:5px 12px;font-size:.82rem;width:130px;outline:none}
.sb:focus{border-color:var(--ch)}
.leg{display:flex;gap:12px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#lv{padding:12px;display:flex;flex-direction:column;gap:6px}
.mh{font-size:.9rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.7px;padding:10px 0 5px;border-bottom:1px solid var(--bd);margin-top:6px}
.ec{background:#fff;border-radius:10px;border:1.5px solid var(--bd);border-left:4px solid var(--bd);padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer}
.ec.cc{border-left-color:var(--ch)}.ec.cf{border-left-color:var(--fa)}.ec.hidden{display:none!important}
.eh{display:flex;align-items:flex-start;gap:8px}
.en{font-weight:700;font-size:.92rem;flex:1}
.tg{font-size:.68rem;font-weight:700;border-radius:4px;padding:2px 6px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;margin-top:2px}
.tc{background:var(--chl);color:var(--ch)}.tf{background:var(--fal);color:var(--fa)}
.tfr{background:#dcfce7;color:var(--fr)}.tr{background:#e0f2fe;color:var(--rc)}
.em{margin-top:6px;font-size:.8rem;color:var(--mu);display:flex;flex-direction:column;gap:2px}
.em span{display:flex;gap:4px}
.et{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.an{font-size:.78rem;color:var(--mu);margin-top:5px;font-style:italic}
#cv{padding:12px;display:none}
.wb{margin-bottom:18px}
.wl{font-size:.82rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;padding-bottom:4px;border-bottom:2px solid var(--bd)}
.dhs{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.dhl{text-align:center;font-size:.65rem;font-weight:700;color:var(--mu);text-transform:uppercase}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd{min-height:76px;background:#fff;border:1px solid var(--bd);border-radius:7px;padding:4px}
.cd.oor{background:#f5f5f4;opacity:.4}.cd.tod{border-color:var(--ch);background:var(--chl)}
.dn{font-size:.7rem;font-weight:700;color:var(--mu);margin-bottom:2px}.dn.tn{color:var(--ch)}
.ce{font-size:.58rem;font-weight:600;border-radius:3px;padding:1px 3px;margin-bottom:2px;line-height:1.3;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ce.cc{background:var(--chl);color:var(--ch);border-left:2px solid var(--ch)}
.ce.cf{background:var(--fal);color:var(--fa);border-left:2px solid var(--fa)}
.ce.hidden{display:none!important}
.me{font-size:.58rem;color:var(--mu);font-weight:600}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.mbg.open{display:flex}
.mdl{background:#fff;border-radius:16px 16px 0 0;padding:20px 18px 36px;width:100%;max-width:520px;animation:su .2s ease;position:relative}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhd{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 14px}
.mn{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.mr{display:flex;gap:8px;font-size:.85rem;margin-bottom:6px}
.ml{color:var(--mu);width:58px;flex-shrink:0;font-size:.78rem}
.murl{display:inline-block;margin-top:10px;font-size:.82rem;color:var(--ch);font-weight:600;text-decoration:none}
.mcl{position:absolute;top:14px;right:14px;background:var(--bd);border:none;width:28px;height:28px;border-radius:50%;font-size:1rem;cursor:pointer;line-height:28px}
@media print{
  .ctrl,.leg,.mbg{display:none!important}
  body{background:#fff;font-size:11px}
  .hdr{background:#f97316!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:10px}
  .hdr h1{font-size:1rem}
  #lv,#cv{display:none!important}
  .wp{display:block!important;page-break-before:always;page-break-inside:avoid;padding:12px}
  .wp:first-of-type{page-break-before:auto}
  .wph{font-size:.75rem;font-weight:700;color:#555;text-transform:uppercase;border-bottom:2px solid #f97316;padding-bottom:4px;margin-bottom:8px}
  .wpg{display:grid!important;grid-template-columns:repeat(7,1fr);gap:5px}
  .wpd{border:1px solid #ddd;border-radius:5px;padding:5px;min-height:90px}
  .wpdn{font-size:.62rem;font-weight:700;color:#888;text-transform:uppercase}
  .wpdt{font-size:.95rem;font-weight:700;margin:2px 0 4px}
  .wpe{font-size:.58rem;line-height:1.3;padding:2px 3px;border-radius:3px;margin-bottom:2px}
  .wpe.cc{background:#fff7ed;color:#f97316;border-left:2px solid #f97316}
  .wpe.cf{background:#f5f3ff;color:#7c3aed;border-left:2px solid #7c3aed}
  .wpd.oor{opacity:.35}
  .ec.hidden{display:none!important}
}
.wp{display:none}
.ep{opacity:.42}
#ss{font-size:.72rem;margin-top:5px;color:rgba(255,255,255,.82)}
</style>
</head>
<body>
<header class="hdr">
  <h1>&#9728;&#65039; Lisa's Summer 2026 Calendar</h1>
  <p>Northwest Metro Atlanta &middot; May 16 – August 17</p>
  <div id="ss">Syncing your Google Calendar…</div>
</header>
<div class="ctrl">
  <button class="fb aa" onclick="sf('all',this)">All Events</button>
  <button class="fb" onclick="sf('child',this)">&#129505; Kids</button>
  <button class="fb" onclick="sf('family',this)">&#128156; Family</button>
  <button class="fb" onclick="sf('free',this)">&#9989; Free</button>
  <button id="ptb" class="fb" onclick="togglePast()">&#9197; Past</button>
  <input class="sb" type="search" placeholder="&#128269; Search&hellip;" oninput="ds(this.value)">
  <div class="vt">
    <button class="vb on" onclick="sv('list',this)">List</button>
    <button class="vb" onclick="sv('cal',this)">Calendar</button>
  </div>
</div>
<div class="leg">
  <div class="li"><div class="dot" style="background:var(--ch)"></div>Kids/Toddler</div>
  <div class="li"><div class="dot" style="background:var(--fa)"></div>Family</div>
  <div class="li"><div class="dot" style="background:var(--fr)"></div>Free</div>
  <div class="li"><div class="dot" style="background:var(--rc);border-radius:2px"></div>Recurring</div>
</div>
<div id="lv"></div>
<div id="cv"></div>
<div id="pw"></div>
<div class="mbg" id="modal" onclick="if(event.target===this)cm()">
  <div class="mdl">
    <div class="mhd"></div>
    <button class="mcl" onclick="cm()">&#10005;</button>
    <div class="mn" id="mn"></div>
    <div class="mr"><span class="ml">&#128197; Dates</span><span id="md"></span></div>
    <div class="mr" id="mtr"><span class="ml">&#128336; Time</span><span id="mt"></span></div>
    <div class="mr" id="mvr"><span class="ml">&#128205; Where</span><span id="mv"></span></div>
    <div class="mr" id="mcr"><span class="ml">&#128176; Cost</span><span id="mc"></span></div>
    <div class="mr" id="mar"><span class="ml">&#128118; Ages</span><span id="ma"></span></div>
    <a id="mu" class="murl" href="#" target="_blank" rel="noopener">&#128279; More info &rarr;</a>
    <div id="mga" class="an" style="display:none">&#10010; Added from your Summer 2026 Google Calendar</div>
  </div>
</div>
<script>
var E=[];
var fi="all",se="",showPast=false;
var ICAL_URL="https://calendar.google.com/calendar/ical/9e7714ddcad76bccd50e26fdaefdcf3a3bce9ec417e01d30c172c6539799dbb6%40group.calendar.google.com/public/basic.ics";
var PROXY="https://api.allorigins.win/get?url=";
function fr(e){return!!(e.cost&&e.cost.toLowerCase().indexOf("free")===0)}
function rd(s){
  if(!s)return new Date(2026,4,16);
  var m={may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7};
  var a=s.toLowerCase().match(/\b(may|jun|june|jul|july|aug|august)\b/);
  var d=s.match(/\b(\d{1,2})\b/);
  if(a&&d&&m[a[1]]!==undefined)return new Date(2026,m[a[1]],+d[1]);
  return new Date(2026,4,16);
}
function ld(s){
  if(!s)return new Date(2026,7,17);
  var m={may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7};
  var re=/(may|jun|june|jul|july|aug|august)\s+(\d{1,2})/gi;
  var x,last;
  while((x=re.exec((s||"").toLowerCase()))!==null){var mo=m[x[1]];if(mo!==undefined)last=new Date(2026,mo,+x[2]);}
  return last||new Date(2026,7,17);
}
function isPast(e){var t=new Date();t.setHours(0,0,0,0);return ld(e.dates||"")<t;}
function sf(f,b){
  fi=f;
  document.querySelectorAll(".fb").forEach(function(x){x.className="fb";});
  b.className="fb "+(f==="all"?"aa":f==="child"?"ac":f==="family"?"af":"ar");
  af();
}
function ds(q){se=q.toLowerCase();af();}
function af(){
  document.querySelectorAll(".ec").forEach(function(c){
    c.classList.toggle("hidden",!((fi==="all"||c.dataset.c===fi||(fi==="free"&&c.dataset.f==="1"))&&(!se||c.dataset.s.indexOf(se)>=0)&&(showPast||c.dataset.past!=="1")));
  });
  document.querySelectorAll(".ce").forEach(function(c){
    c.classList.toggle("hidden",!((fi==="all"||c.dataset.c===fi||(fi==="free"&&c.dataset.f==="1"))&&(!se||c.dataset.s.indexOf(se)>=0)&&(showPast||c.dataset.past!=="1")));
  });
}
function togglePast(){
  showPast=!showPast;
  var b=document.getElementById("ptb");
  b.className=showPast?"fb aa":"fb";
  b.innerHTML=showPast?"⌛ Hide past":"&#9197; Past";
  af();
}
function sv(v,b){
  document.querySelectorAll(".vb").forEach(function(x){x.classList.remove("on");});
  b.classList.add("on");
  document.getElementById("lv").style.display=v==="list"?"":"none";
  document.getElementById("cv").style.display=v==="cal"?"block":"none";
}
function om(i){
  var e=E[i];
  document.getElementById("mn").textContent=e.name;
  document.getElementById("md").textContent=e.dates;
  document.getElementById("mt").textContent=e.time||"";
  document.getElementById("mtr").style.display=e.time?"":"none";
  document.getElementById("mv").textContent=(e.venue?e.venue+(e.city?', ':''):'')+(e.city||'');
  document.getElementById("mvr").style.display=(e.venue||e.city)?"":"none";
  document.getElementById("mc").textContent=e.cost||"Check organizer";
  document.getElementById("mcr").style.display="";
  document.getElementById("ma").textContent=e.ageNotes||"";
  document.getElementById("mar").style.display=e.ageNotes?"":"none";
  var u=document.getElementById("mu");
  u.style.display=e.url?"":"none";
  if(e.url)u.href=e.url;
  document.getElementById("modal").classList.add("open");
  var mg=document.getElementById("mga");if(mg)mg.style.display=e.source==="gcal"?"":"none";
}
function cm(){document.getElementById("modal").classList.remove("open");}
function gd(e){
  var out=[],s=e.dates||"";
  var mo={may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7};
  var dw={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  if(e.recurring){
    var sl=s.toLowerCase(),dows=[];
    Object.keys(dw).forEach(function(k){if(sl.indexOf(k)>=0)dows.push(dw[k]);});
    var rx=/(May|Jun|June|Jul|July|Aug|August)\s+(\d+)[^\d]{1,15}[\u2013\-][^\d]{0,5}(May|Jun|June|Jul|July|Aug|August)\s+(\d+)/i;
    var rn=s.match(rx);
    if(rn&&dows.length){
      var sm=mo[rn[1].toLowerCase().slice(0,3)],sd=+rn[2],em=mo[rn[3].toLowerCase().slice(0,3)],ed=+rn[4];
      if(sm!==undefined&&em!==undefined){
        var c=new Date(2026,sm,sd),en=new Date(2026,em,ed);
        while(c<=en){if(dows.indexOf(c.getDay())>=0)out.push(new Date(c));c.setDate(c.getDate()+1);}
      }
    }
    if(!out.length){
      var sp=s.match(/(May|Jun|June|Jul|July|Aug|August)\s+(\d+)/gi)||[];
      sp.forEach(function(x){var p=x.match(/(May|Jun|June|Jul|July|Aug|August)\s+(\d+)/i);if(p&&mo[p[1].toLowerCase().slice(0,3)]!==undefined)out.push(new Date(2026,mo[p[1].toLowerCase().slice(0,3)],+p[2]));});
    }
    return out.length?out:[new Date(2026,4,16)];
  }
  var all=s.match(/(May|Jun|June|Jul|July|Aug|August)\s+(\d+)/gi)||[];
  all.forEach(function(x){var p=x.match(/(May|Jun|June|Jul|July|Aug|August)\s+(\d+)/i);if(p&&mo[p[1].toLowerCase().slice(0,3)]!==undefined)out.push(new Date(2026,mo[p[1].toLowerCase().slice(0,3)],+p[2]));});
  return out.length?[out[0]]:[];
}
function mk(e,i){
  var ss=[e.name,e.city,e.venue,e.dates,e.ageNotes,e.cost].filter(Boolean).join(" ").toLowerCase().replace(/"/g,"");
  var ct=e.category==="child"?'<span class="tg tc">Kids</span>'  :'<span class="tg tf">Family</span>';
  var ft=fr(e)?'<span class="tg tfr">Free</span>':"";
  var rt=e.recurring?'<span class="tg tr">Weekly</span>':"";
  var pa=isPast(e)?"1":"0";
  return '<div class="ec '+( e.category==="child"?"cc":"cf")+(isPast(e)?" ep":"")+'" data-c="'+e.category+'" data-f="'+( fr(e)?"1":"0")+'" data-s="'+ss+'" data-past="'+pa+'" onclick="om('+i+')">'
    +'<div class="eh"><div class="en">'+e.name+'</div>'+ct+'</div>'
    +'<div class="em">'
    +'<span>&#128197; '+e.dates+'</span>'
    +(e.time?'<span>&#128336; '+e.time+'</span>':"")
    +'<span>&#128205; '+(e.venue?e.venue+", ":"")+e.city+'</span>'
    +(e.cost?'<span>&#128176; '+e.cost+'</span>':"")
    +'</div>'
    +'<div class="et">'+ft+rt+'</div>'
    +(e.ageNotes?'<div class="an">'+e.ageNotes+'</div>':"")
    +'</div>';
}
function buildList(){
  var h="";
  var rec=E.map(function(e,i){return{e:e,i:i};}).filter(function(x){return x.e.recurring;});
  if(rec.length){h+='<div class="mh">&#128198; Recurring All Summer</div>';rec.forEach(function(x){h+=mk(x.e,x.i);});}
  [{m:4,l:"May 2026"},{m:5,l:"June 2026"},{m:6,l:"July 2026"},{m:7,l:"August 2026"}].forEach(function(obj){
    var items=E.map(function(e,i){return{e:e,i:i};}).filter(function(x){return !x.e.recurring&&rd(x.e.dates).getMonth()===obj.m;});
    if(!items.length)return;
    items.sort(function(a,b){return rd(a.e.dates)-rd(b.e.dates);});
    h+='<div class="mh">'+obj.l+'</div>';
    items.forEach(function(x){h+=mk(x.e,x.i);});
  });
  document.getElementById("lv").innerHTML=h;
}
function buildCal(){
  var dm={};
  E.forEach(function(e,i){gd(e).forEach(function(d){var k=d.toISOString().slice(0,10);if(!dm[k])dm[k]=[];dm[k].push({e:e,i:i});});});
  var ds=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var rs=new Date(2026,4,16),re=new Date(2026,7,17),cur=new Date(2026,4,17);
  var h='<div class="dhs">'+ds.map(function(d){return'<div class="dhl">'+d+'</div>';}).join("")+'</div>';
  while(cur<=re){
    var ws=new Date(cur),we=new Date(cur);we.setDate(we.getDate()+6);
    var wl=ws.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" – "+we.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    h+='<div class="wb"><div class="wl">Week of '+wl+'</div><div class="cg">';
    for(var j=0;j<7;j++){
      var day=new Date(cur);day.setDate(cur.getDate()+j);
      var k=day.toISOString().slice(0,10),oor=day<rs||day>re,tod=k===new Date().toISOString().slice(0,10);
      h+='<div class="cd'+(oor?" oor":"")+(tod?" tod":"")+'"><div class="dn'+(tod?" tn":"")+'">'+day.getDate()+'</div>';
      var ev=dm[k]||[];
      ev.slice(0,3).forEach(function(x){
        var ss=[x.e.name,x.e.city].join(" ").toLowerCase();
        h+='<div class="ce '+(x.e.category==="child"?"cc":"cf")+'" data-c="'+x.e.category+'" data-f="'+( fr(x.e)?"1":"0")+'" data-s="'+ss+'" data-past="'+(isPast(x.e)?"1":"0")+'" onclick="om('+x.i+')" title="'+x.e.name.replace(/"/g,"&quot;")+'">'+x.e.name+'</div>';
      });
      if(ev.length>3)h+='<div class="me">+'+(ev.length-3)+' more</div>';
      h+='</div>';
    }
    h+='</div></div>';
    cur.setDate(cur.getDate()+7);
  }
  document.getElementById("cv").innerHTML=h;
}
function buildPrint(){
  var dm={};
  E.forEach(function(e){gd(e).forEach(function(d){var k=d.toISOString().slice(0,10);if(!dm[k])dm[k]=[];dm[k].push(e);});});
  var ds=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var rs=new Date(2026,4,16),re=new Date(2026,7,17),cur=new Date(2026,4,17);
  var h="";
  while(cur<=re){
    var ws=new Date(cur),we=new Date(cur);we.setDate(we.getDate()+6);
    var wl="WEEK OF "+ws.toLocaleDateString("en-US",{month:"long",day:"numeric"}).toUpperCase()+" – "+we.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}).toUpperCase();
    h+='<div class="wp"><div class="wph">'+wl+'</div><div class="wpg">';
    for(var j=0;j<7;j++){
      var day=new Date(cur);day.setDate(cur.getDate()+j);
      var k=day.toISOString().slice(0,10),oor=day<rs||day>re;
      h+='<div class="wpd'+(oor?" oor":"")+'"><div class="wpdn">'+ds[(cur.getDay()+j)%7]+'</div><div class="wpdt">'+day.getDate()+'</div>';
      if(!oor)(dm[k]||[]).forEach(function(e){h+='<div class="wpe '+(e.category==="child"?"cc":"cf")+'">'+e.name+'</div>';});
      h+='</div>';
    }
    h+='</div></div>';
    cur.setDate(cur.getDate()+7);
  }
  document.getElementById("pw").innerHTML=h;
}

function parseICS(text){
  text=text.replace(/\r?\n[ \t]/g,'');
  var evs=[],lines=text.split(/\r?\n/),inEv=false,ev={};
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(ln==='BEGIN:VEVENT'){inEv=true;ev={};continue;}
    if(ln==='END:VEVENT'){
      if(ev.name){var p=icsToObj(ev);if(p)evs.push(p);}
      inEv=false;continue;
    }
    if(!inEv)continue;
    var ci=ln.indexOf(':');if(ci<0)continue;
    var key=ln.substring(0,ci).split(';')[0].toUpperCase();
    var val=ln.substring(ci+1);
    var clean=function(v){return v.replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\n/g,' ').trim();};
    if(key==='SUMMARY')ev.name=clean(val);
    else if(key==='DTSTART')ev.dtstart=val.trim();
    else if(key==='DTEND')ev.dtend=val.trim();
    else if(key==='LOCATION')ev.location=clean(val);
    else if(key==='DESCRIPTION')ev.desc=clean(val);
    else if(key==='URL')ev.url=val.trim();
  }
  return evs;
}
function icsToObj(ev){
  var ds=ev.dtstart||'',dateStr='',timeStr=null;
  var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(ds.length>=8){
    var yr=+ds.slice(0,4),mo=+ds.slice(4,6)-1,dy=+ds.slice(6,8);
    dateStr=MN[mo]+' '+dy;
    if(ds.length>=15){
      var hr=+ds.slice(9,11),mi=+ds.slice(11,13);
      if(ds.endsWith('Z'))hr=(hr-4+24)%24;
      var ap=hr>=12?'PM':'AM',h12=hr%12||12;
      timeStr=h12+':'+(mi<10?'0':'')+mi+' '+ap;
    }
  }
  if(!dateStr)return null;
  var loc=ev.location||'',venue='',city='';
  var pts=loc.split(',');
  if(pts.length>=2){venue=pts[0].trim();city=pts[pts.length-1].trim().replace(/\s*(GA|Georgia)\b.*/i,'').replace(/\s+\d{5}\b.*/,'').trim();}
  else if(loc){venue=loc;}
  var desc=ev.desc||'';
  var cat=/\b(baby|babies|infant|toddler|kids|children|ages?\s*0\s*[-–]\s*\d)\b/i.test(desc)?'child':'family';
  var cost=null;
  if(/\bfree\b/i.test(desc))cost='Free';
  else{var cm=desc.match(/\$[\d,]+(?:\.\d+)?(?:\/\w+)?/);if(cm)cost=cm[0];}
  return{name:ev.name,dates:dateStr,time:timeStr,venue:venue||null,city:city||'',
    cost:cost,ageNotes:desc?desc.substring(0,140):null,url:ev.url||null,
    category:cat,recurring:false,source:'gcal'};
}
function fetchGCal(){
  var ss=document.getElementById('ss');
  fetch(PROXY+encodeURIComponent(ICAL_URL))
    .then(function(r){return r.ok?r.json():Promise.reject(r.status);})
    .then(function(data){
      var txt=data.contents||'';
      if(txt.indexOf('data:')===0){var b64=txt.split(',')[1];var bytes=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0);});txt=new TextDecoder('utf-8').decode(bytes);}
      var newEvs=parseICS(txt),added=0;
      newEvs.forEach(function(nv){
        var dup=E.some(function(x){return x.name.toLowerCase()===nv.name.toLowerCase();});
        if(!dup&&nv.dates){E.push(nv);added++;}
      });
      if(added){buildList();buildCal();buildPrint();}
      if(ss){
        var now=new Date(),t=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        ss.textContent=added?'+ '+added+' event'+(added>1?'s':'')+' from your calendar · '+t:'✓ Up to date · '+t;
        ss.style.color='rgba(255,255,255,.9)';
      }
    })
    .catch(function(){if(ss){ss.textContent='⚠️ Calendar sync offline – showing curated events';ss.style.color='rgba(255,200,100,.9)';}});
}
document.addEventListener("DOMContentLoaded",function(){buildList();buildCal();buildPrint();fetchGCal();});
